name: Android Store Bundle

on:
  workflow_dispatch:
    inputs:
      build_name:
        description: Store version name
        required: true
        default: 1.0.0
      build_number:
        description: Monotonically increasing Play version code
        required: true
        default: "1"

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: google-play
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.4
          cache: true
      - name: Validate signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_PASSWORD"
          test -n "$KEY_ALIAS"
      - name: Configure upload signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
          {
            printf 'storePassword=%s\n' "$STORE_PASSWORD"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'storeFile=../upload-keystore.jks\n'
          } > android/key.properties
      - name: Resolve dependencies
        run: flutter pub get
      - name: Verify source
        run: |
          dart analyze
          flutter test
      - name: Build signed Play bundle
        run: >-
          flutter build appbundle --release
          --build-name="${{ inputs.build_name }}"
          --build-number="${{ inputs.build_number }}"
      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: hok-helper-${{ inputs.build_name }}-${{ inputs.build_number }}
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
